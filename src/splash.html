<!-- The loading screen: the logo draws itself on frosted glass until the page has loaded. scripts/build.mjs puts this
     at the top of the hub and of every app's page. Arriving from the hub, the drawing carries on where it left off. -->
<style>
  .hub-splash {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: grid;
    place-items: center;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.14);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    transition: opacity 0.3s ease-out;
  }
  .hub-splash.done { opacity: 0; }
  .hub-splash svg { width: min(60vw, 320px); height: auto; overflow: visible; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45)); }
  .hub-splash path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: hub-draw var(--d) cubic-bezier(0.45, 0, 0.25, 1) forwards;
    animation-delay: calc(var(--at) - var(--skip, 0s));
  }
  @keyframes hub-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .hub-splash path { animation: none; stroke-dashoffset: 0; } }
</style>
<div class="hub-splash" aria-hidden="true">
  <svg viewBox="28 30 536 228">
    <path pathLength="1" style="--at: 0s; --d: 0.7s" stroke="#111" stroke-width="26"
      d="M298 97C270 60 200 42 140 46C90 50 52 72 46 112C40 160 62 206 108 210C150 214 230 160 300 132C370 104 440 84 500 94C545 106 552 150 545 182C536 222 500 240 440 241C380 242 318 242 288 222C272 211 266 197 266 186" />
    <path pathLength="1" style="--at: 0.6s; --d: 0.35s" stroke="#f39c12" stroke-width="16"
      d="M77 150L97 98L110 161L140 70L157 158L190 93L200 132L216 99L225 112L240 96L251 106" />
    <path pathLength="1" style="--at: 0.9s; --d: 0.4s" stroke="#f39c12" stroke-width="16"
      d="M292 167L300 182L331 151L337 177L350 132L356 198L402 121L405 208L436 145L437 198L452 134L458 182L477 135L482 177L498 150L501 178L512 150" />
  </svg>
</div>
<script>
  (() => {
    const splash = document.currentScript.previousElementSibling;
    window.hubSplash = splash.cloneNode(true); // the hub shows a fresh copy when a game is opened
    let start = Date.now();
    try {
      const launched = +sessionStorage.getItem('hub.launch');
      sessionStorage.removeItem('hub.launch');
      if (launched && start - launched < 5000) start = launched; // opened from the hub: carry on its drawing
    } catch {}
    splash.style.setProperty('--skip', `${(Date.now() - start) / 1000}s`);
    let hidden = false;
    const hide = () => {
      if (hidden) return;
      hidden = true;
      setTimeout(() => {
        splash.classList.add('done');
        setTimeout(() => splash.remove(), 300);
      }, Math.max(0, start + 1300 - Date.now())); // let the logo finish drawing first
    };
    if (document.readyState === 'complete') hide();
    else addEventListener('load', hide, { once: true });
    setTimeout(hide, 8000); // a page that never finishes loading still gets uncovered
  })();
</script>
