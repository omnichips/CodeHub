<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121428" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{TITLE}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>{{TITLE}}</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preload" href="/fonts/PressStart2P.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <button class="settings" id="settings" type="button" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M3 0h1v1H3zM1 1h5v1H1zM1 2h2v1H1zM4 2h2v1H4zM0 3h2v1H0zM5 3h2v1H5zM1 4h2v1H1zM4 4h2v1H4zM1 5h5v1H1zM3 6h1v1H3z" />
      </svg>
    </button>
    <main class="home" id="home" aria-label="Apps"></main>
    <nav class="dock" id="dock" aria-label="Favourite apps"></nav>
    <script id="apps" type="application/json">{{APPS}}</script>
    <script src="/wallpapers.js"></script>
    <script src="/launcher.js"></script>
  </body>
</html>
