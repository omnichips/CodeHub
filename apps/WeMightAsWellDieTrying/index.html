<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#232526" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Die Trying" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>We Might As Well Die Trying</title>
    <style>
      :root {
        --ink: #eadfae; --dim: #8c8466; --line: #141516; --panel: rgba(20, 21, 22, 0.84);
        --olive: #48512f; --olive-lit: #65703f; --warn: #c97a6a;
        --top: max(8px, env(safe-area-inset-top)); --left: max(8px, env(safe-area-inset-left));
        --right: max(8px, env(safe-area-inset-right)); --bottom: max(8px, env(safe-area-inset-bottom));
      }
      html, body { margin: 0; height: 100%; background: #232526; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { font: 600 13px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; }
      button {
        font: inherit; color: var(--ink); background: var(--olive); border: 2px solid var(--line);
        min-height: 40px; min-width: 44px; padding: 0 12px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
      }
      button { transition: transform 0.08s ease-out, background-color 0.15s, filter 0.15s; }
      button:active:not(:disabled) { transform: translateY(1px) scale(0.96); filter: brightness(1.15); }
      button[aria-pressed="true"] { background: var(--olive-lit); box-shadow: inset 0 -3px 0 var(--ink); }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
      @media (hover: hover) { button:hover { background: var(--olive-lit); } }

      #mode { position: fixed; top: var(--top); right: var(--right); }

      #hud { position: fixed; inset: 0; pointer-events: none; }
      #hud > * { position: absolute; pointer-events: auto; }
      #hud .status { top: var(--top); left: var(--left); display: flex; gap: 6px; pointer-events: none; }
      #hud .status span, #hud .actions .label { background: var(--panel); border: 2px solid var(--line); padding: 7px 10px; white-space: nowrap; }
      #hud .status .warn { color: var(--warn); }
      #hud .time { top: var(--top); right: var(--right); display: flex; gap: 6px; }
      #hud .speeds { display: flex; gap: 4px; }
      #hud .speeds button { min-width: 40px; padding: 0 8px; }
      #hud .go { background: #7d3a33; padding: 0 22px; letter-spacing: 0.06em; text-transform: uppercase; }
      @media (hover: hover) { #hud .go:hover { background: #9c4f44; } }
      #hud .dock { bottom: var(--bottom); left: var(--left); display: flex; flex-direction: column; gap: 4px; max-width: min(62vw, calc(100vw - 260px)); }
      #hud .tabs { display: flex; gap: 4px; }
      #hud .tab { min-height: 30px; padding: 0 10px; font-size: 12px; background: var(--panel); }
      #hud .bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; overscroll-behavior: contain; }
      #hud .bar::-webkit-scrollbar { display: none; }
      #hud .item { position: relative; flex: none; width: 54px; height: 54px; padding: 0; background: var(--panel); touch-action: pan-x; }
      #hud .item img { width: 40px; height: 40px; image-rendering: pixelated; pointer-events: none; vertical-align: middle; }
      #hud .item .count { position: absolute; right: 3px; bottom: 1px; font-size: 11px; color: var(--dim); }
      #hud .item.empty { opacity: 0.4; }
      #hud .item::after { content: ''; position: absolute; inset: 0; background: rgba(20, 21, 22, 0.7); transform-origin: bottom; transform: scaleY(var(--cool, 0)); pointer-events: none; }
      #hud .actions { bottom: var(--bottom); right: var(--right); display: flex; gap: 6px; align-items: center; }
      #hud .end {
        inset: 0; margin: auto; width: min(340px, 80vw); height: fit-content; max-height: calc(100% - 16px); overflow-y: auto; padding: 20px; text-align: center;
        background: var(--panel); border: 2px solid var(--line);
      }
      #hud .end h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.04em; }
      #hud .end p { margin: 0 0 16px; color: var(--dim); }
      #hud .menu { pointer-events: auto; background: var(--panel); }
      #hud .tip { top: 64px; left: 50%; transform: translateX(-50%); width: min(460px, 70vw); display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel); border: 2px solid var(--flash, #c4a058); }
      #hud .tip p { margin: 0; flex: 1; line-height: 1.4; }
      #hud .end .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #hud .end .chips { list-style: none; margin: 0 0 6px; padding: 0; color: var(--dim); line-height: 1.6; }
      #hud .end .total { font-size: 18px; color: var(--ink); }
      #hud .end h3 { margin: 0 0 4px; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
      #hud .end:has(.cols) { width: min(560px, 92vw); }
      #hud .end .cols { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 32px; margin-bottom: 14px; }
      #hud .end .cols > div { min-width: 200px; }
      /* A soldier down: a line under the status, tap it to look. */
      #hud .notices { top: calc(var(--top) + 46px); left: var(--left); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
      #hud .notices button { pointer-events: auto; min-height: 32px; font-size: 12px; background: var(--panel); border-color: #c9473a; color: #e8a093; animation: pop 0.15s ease-out; }
      #hud.lefty .notices { left: auto; right: var(--right); align-items: flex-end; }
      /* Left-handed: the bar and actions swap sides, and so do the status and the time controls. */
      #hud.lefty .dock { left: auto; right: var(--right); align-items: flex-end; }
      #hud.lefty .actions { right: auto; left: var(--left); }
      #hud.lefty .status { left: auto; right: var(--right); }
      #hud.lefty .time { right: auto; left: var(--left); }

      /* Main menu, map select and settings: one panel at a time, on the left, over the drifting city. */
      #menu { position: fixed; inset: 0; display: flex; align-items: center; padding: var(--top) var(--right) var(--bottom) var(--left);
        background: linear-gradient(90deg, rgba(20, 21, 22, 0.88) 0, rgba(20, 21, 22, 0.55) 380px, transparent 640px); }
      #menu .panel { display: flex; flex-direction: column; gap: 8px; width: min(320px, 100%); max-height: 100%; overflow-y: auto; margin-left: 4vw; }
      #menu h1 { margin: 0 0 4px; font-size: clamp(18px, 3.4vw, 26px); line-height: 1.1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
      #menu h1 span { display: block; font-size: clamp(30px, 7vw, 52px); color: #c9473a; text-shadow: 3px 3px 0 var(--line); }
      #menu h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.04em; }
      #menu .chips { margin: 0 0 8px; color: #c4a058; }
      #menu .panel > button { min-height: 46px; text-align: left; }
      /* A long list (the cities) scrolls with a finger, buttons included. */
      #menu .panel, #menu .panel button { touch-action: pan-y; overscroll-behavior: contain; }
      #menu .go { background: #7d3a33; letter-spacing: 0.06em; text-transform: uppercase; }
      @media (hover: hover) { #menu .go:not(:disabled):hover { background: #9c4f44; } }
      #menu .map { display: flex; flex-direction: column; justify-content: center; padding: 6px 12px; }
      #menu .map small { color: var(--dim); font-size: 11px; }
      #menu button:disabled { opacity: 0.45; cursor: default; }
      #menu .settings { width: min(440px, 100%); gap: 6px; }
      #menu .head { display: flex; gap: 10px; align-items: center; }
      #menu .head h2 { margin: 0; }
      #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 2px solid var(--line); padding: 3px 3px 3px 10px; }
      #menu .seg { display: flex; gap: 4px; }
      #menu .seg button { min-height: 32px; padding: 0 10px; }
      #menu .danger { background: #6b2a25; }
      #menu input[type=range] { width: 50%; accent-color: #c4a058; min-height: 32px; margin: 0; }

      /* Skill web: a bar on top, the plane filling the screen, the picked node's card at the bottom. */
      #menu:has(.web) { padding: 0; background: rgba(20, 21, 22, 0.8); }
      #menu .web { position: absolute; inset: 0; }
      #menu .web .top { position: absolute; z-index: 1; top: var(--top); left: var(--left); right: var(--right); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #menu .web .top .chips { margin: 0; background: var(--panel); border: 2px solid var(--line); padding: 9px 10px; }
      #menu .web .tabs { display: flex; gap: 4px; margin-left: auto; }
      #menu .view { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
      #menu .plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; } /* sized to the web in tree.ts */
      #menu .plane svg { position: absolute; inset: 0; pointer-events: none; }
      #menu .plane line { stroke: #3a3b3c; stroke-width: 3; }
      #menu .plane line.open { stroke: var(--dim); }
      #menu .plane line.owned { stroke: var(--ink); }
      #menu .node { position: absolute; width: 40px; height: 40px; min-width: 0; min-height: 0; padding: 0; transform: translate(-50%, -50%); background: var(--panel); border-color: #3a3b3c; }
      #menu .node.big { width: 54px; height: 54px; }
      #menu .node img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; vertical-align: middle; }
      #menu .node.big img { width: 44px; height: 44px; }
      #menu .node small { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: 10px; color: var(--dim); pointer-events: none; }
      #menu .node.owned { background: var(--olive); border-color: var(--ink); }
      #menu .node.open { border-color: var(--dim); }
      #menu .node.afford { border-color: #c4a058; }
      #menu .node.part { background: #2c3220; }
      #menu .node .lv { position: absolute; right: -6px; top: -8px; font: 700 9px/1 ui-monospace, Menlo, Consolas, monospace; font-style: normal; color: var(--ink); background: var(--line); padding: 2px 3px; pointer-events: none; }
      #menu .node .lv:empty { display: none; }
      #menu .node.afford small { color: #c4a058; }
      #menu .node.locked img { opacity: 0.35; filter: grayscale(1); }
      #menu .node.picked { outline: 3px solid #c9473a; outline-offset: 2px; }
      #menu .info { position: absolute; left: 50%; bottom: var(--bottom); transform: translateX(-50%); width: min(560px, calc(100vw - 16px)); box-sizing: border-box;
        display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 2px solid var(--line); }
      #menu .info img { width: 40px; height: 40px; image-rendering: pixelated; }
      #menu .info div { flex: 1; }
      #menu .info p { margin: 2px 0 0; color: var(--dim); line-height: 1.35; }
      #menu .info > p { margin: 0; }
      /* A phone held upright: ask for it sideways (the game is landscape only). */
      #turn { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; gap: 20px; align-items: center; justify-content: center; background: #232526; text-align: center; font-size: 16px; }
      #turn .phone { width: 34px; height: 58px; border: 3px solid var(--ink); border-radius: 6px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #turn .phone { animation: none; transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
      /* Who something is: a box over a bar item or a soldier. */
      #hud .hint { position: fixed; z-index: 5; max-width: 240px; padding: 8px 10px; background: #141516; border: 2px solid #c4a058; pointer-events: none; animation: pop 0.12s ease-out; }
      #hud .hint p { margin: 3px 0 0; color: var(--dim); line-height: 1.35; font-weight: 500; }
      /* The city's name at the start, each wave as it comes: in, a moment, out. */
      #hud .banner { inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
      #hud .banner > div { text-align: center; animation: banner 2.4s ease-out both; text-shadow: 3px 3px 0 var(--line); }
      #hud .banner h2 { margin: 0; font-size: clamp(26px, 6vw, 48px); letter-spacing: 0.08em; text-transform: uppercase; color: #c9473a; }
      #hud .banner p { margin: 4px 0 0; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; }
      @keyframes banner { 0% { opacity: 0; transform: scale(1.25); } 14% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
      @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
      /* Menu screens slide in; starting a game fades the menu away. */
      #menu .panel, #menu .web { animation: panel-in 0.22s ease-out; }
      @keyframes panel-in { from { opacity: 0; transform: translateX(-18px); } }
      #menu { transition: opacity 0.35s; }
      #menu.leaving { opacity: 0; pointer-events: none; }
      #menu .node:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.92); }
      #menu .slots { width: min(520px, 100%); }
      #menu .slotrow { display: flex; gap: 6px; }
      #menu .slotrow .slot { flex: 1; }
      #menu .slot { display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 6px 12px; min-height: 52px; }
      #menu .slot small { color: var(--dim); font-size: 11px; }
      #menu .stats { width: min(560px, 100%); }
      #menu table { border-collapse: collapse; background: var(--panel); border: 2px solid var(--line); }
      #menu th, #menu td { padding: 6px 10px; text-align: right; white-space: nowrap; }
      #menu tr > th:first-child { text-align: left; color: var(--dim); }
      #menu tr:first-child th { color: var(--ink); border-bottom: 2px solid var(--line); }
      #menu .note { margin: 4px 0 0; color: #c4a058; min-height: 1em; }
      #menu .settings > button { text-align: left; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        #hud .banner > div { animation: none; opacity: 0; }
      }
      /* The game crashed: what happened, and a report to copy and send. */
      #crash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 10px; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: rgba(20, 21, 22, 0.96); }
      #crash h2 { margin: 0; color: #c9473a; letter-spacing: 0.04em; }
      #crash p { margin: 0; color: var(--dim); }
      #crash textarea { flex: 1; min-height: 80px; font: 500 11px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #141516; border: 2px solid var(--line); padding: 8px; resize: none; -webkit-user-select: text; user-select: text; }
      #crash .row { display: flex; gap: 8px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="menu" hidden></div>
    <div id="turn"><div class="phone"></div>Turn your phone sideways</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
